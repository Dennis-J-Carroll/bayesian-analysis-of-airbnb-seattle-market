# dashboard/config/column_aliases.yaml
# Fuzzy matching aliases for schema detection
# Each standard column lists common variations seen in CSV uploads

price:
  - price
  - price_per_night
  - nightly_price
  - cost
  - rate
  - amount

neighbourhood_cleansed:
  - neighbourhood_cleansed
  - neighborhood
  - neighbourhood
  - area
  - district
  - location

room_type:
  - room_type
  - property_type
  - listing_type
  - type

accommodates:
  - accommodates
  - max_guests
  - capacity
  - guests
  - sleeps

bedrooms:
  - bedrooms
  - bedroom_count
  - num_bedrooms

bathrooms:
  - bathrooms
  - bathroom_count
  - num_bathrooms

beds:
  - beds
  - bed_count
  - num_beds

availability_365:
  - availability_365
  - available_days
  - availability
  - days_available

review_scores_rating:
  - review_scores_rating
  - rating
  - review_score
  - review_rating
  - score

validation_rules:
  required_columns:
    - price
    - neighbourhood_cleansed
    - room_type
    - accommodates

  optional_columns:
    - bedrooms
    - bathrooms
    - beds
    - availability_365
    - review_scores_rating

  numeric_columns:
    - price
    - accommodates
    - bedrooms
    - bathrooms
    - beds
    - availability_365
    - review_scores_rating

  integer_columns:
    - accommodates
    - bedrooms
    - beds
    - availability_365

  categorical_columns:
    - neighbourhood_cleansed
    - room_type

  bounds:
    price:
      min: 0
      max: null  # No upper limit (NYC/SF can exceed $1000)
    accommodates:
      min: 1
      max: 16
    bedrooms:
      min: 0
      max: 10
    bathrooms:
      min: 0
      max: 8
    beds:
      min: 0
      max: 16
    availability_365:
      min: 0
      max: 365
    review_scores_rating:
      min: 0
      max: 5
